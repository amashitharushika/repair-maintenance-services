<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register - RepairPro</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="index.html" class="logo"><span class="logo-text">RepairPro</span></a></div>
        </div>
    </nav>

    <section class="contact"> <div class="container">
            <div class="contact-form" style="max-width: 500px; margin: 0 auto;">
                <div id="authContainer">
                    <h2 id="authTitle">Login</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPass" required>
                        </div>
                        <button type="submit" class="cta-button">Login</button>
                        <p style="margin-top: 1rem;">Don't have an account? <a href="#" id="toRegister">Register here</a></p>
                    </form>

                    <form id="registerForm" style="display: none;">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="regName" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="regEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="regPass" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" id="regConfirmPass" required>
                        </div>
                        <button type="submit" class="cta-button">Register</button>
                        <p style="margin-top: 1rem;">Already have an account? <a href="#" id="toLogin">Login here</a></p>
                    </form>
                    <div id="authMessage" class="error-message"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="scripts/app.js"></script>
</body>
</html>
