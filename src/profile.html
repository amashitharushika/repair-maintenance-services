<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Profile - RepairPro Services">
    <title>My Profile - RepairPro</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html" class="logo">
                    <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="8" fill="#103713"/>
                        <path d="M20 10L25 18H28L23 26H17L12 18H15L20 10Z" fill="#628B35"/>
                        <circle cx="20" cy="22" r="3" fill="#E2DBDO"/>
                        <path d="M15 30L20 28L25 30" stroke="#628B35" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span class="logo-text">RepairPro</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li class="auth-link"><a href="login.html" class="cta-button login-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Login</a></li>
                <li class="auth-link"><a href="register.html" class="cta-button register-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Register</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <section class="profile-section">
        <div class="container">
            <div class="profile-card">
                <div class="profile-header">
                    <h2>My Profile</h2>
                    <p>Manage your account settings and preferences.</p>
                </div>
                
                <div class="profile-body">
                    <div class="profile-avatar-wrapper">
                        <div class="profile-avatar">
                            <img id="avatarImage" src="assests/2.jpg" alt="Profile Avatar" onerror="this.src='https://via.placeholder.com/150'">
                        </div>
                        <button id="uploadAvatarBtn" class="upload-btn" style="display: none;">
                            Change Photo
                        </button>
                        <input type="file" id="avatarInput" hidden accept="image/*">
                    </div>

                    <form id="profileForm" class="profile-form">
                        <div class="form-group">
                            <label for="profileName">Full Name</label>
                            <input type="text" id="profileName" name="name" disabled required>
                        </div>
                        <div class="form-group">
                            <label for="profileEmail">Email Address</label>
                            <input type="email" id="profileEmail" name="email" disabled required>
                        </div>
                        
                        <div id="profileMessage" class="message-area"></div>

                        <div class="form-actions">
                            <button type="button" id="editProfileBtn" class="cta-button">Edit Profile</button>
                            <button type="submit" id="saveProfileBtn" class="cta-button" style="display: none;">Save Changes</button>
                            <button type="button" id="cancelProfileBtn" class="cta-button btn-secondary" style="display: none;">Cancel</button>
                        </div>
                    </form>
                </div>
                
                <div class="logout-section">
                    <button id="logoutBtn" class="text-danger">Log Out</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 RepairPro. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/app.js"></script>
</body>
</html>
