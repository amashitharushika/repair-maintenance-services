<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RepairPro</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="index.html" class="logo"><span class="logo-text">RepairPro</span></a></div>
        </div>
    </nav>

    <section class="contact"> 
        <div class="container">
            <div class="contact-form" style="max-width: 500px; margin: 0 auto;">
                <div id="authContainer">
                    <h2 id="authTitle">Register</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regName">Full Name</label>
                            <input type="text" id="regName" required>
                            <div id="nameError" class="error-message"></div>
                        </div>
                        <div class="form-group">
                            <label for="regEmail">Email</label>
                            <input type="email" id="regEmail" required>
                            <div id="emailError" class="error-message"></div>
                        </div>
                        <div class="form-group">
                            <label for="regPass">Password</label>
                            <input type="password" id="regPass" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="regConfirmPass">Confirm Password</label>
                            <input type="password" id="regConfirmPass" required>
                            <div id="passwordError" class="error-message"></div>
                        </div>
                        <button type="submit" class="cta-button">Register</button>
                        <p style="margin-top: 1rem;">Already have an account? <a href="login.html">Login here</a></p>
                    </form>
                    <div id="authMessage" class="error-message"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="scripts/app.js"></script>
</body>
</html>
